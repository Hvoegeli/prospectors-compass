[project]
name = "prospector-backend"
version = "0.1.0"
description = "Prospector's Compass backend — FastAPI + LangGraph supervisor + subagents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "langsmith>=0.1",
    "httpx>=0.27",
    # Geospatial ingestion (Group 2): read shapefiles/GeoJSON and clip statewide
    # source layers to the 10 I-70-corridor counties before loading into PostGIS.
    # Approved 2026-06-01 as an addition to the locked stack. Pulls shapely/pyproj/pyogrio.
    "geopandas>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
# Make `uv run pytest` (and other dev tools) work without --group dev,
# matching the resume command documented in NEXT_SESSION.md.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
