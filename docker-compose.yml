services:
  db:
    build:
      context: ./infra/db
    image: prospector-db:local
    container_name: prospector-db
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector
      POSTGRES_DB: prospector
    ports:
      # Host port 1776 (5432 is taken by another project on this machine);
      # container still speaks 5432 internally.
      - "1776:5432"
    volumes:
      - prospector_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tileserver:
    # Self-hosted basemap tiles (stack-locked: TileServer GL + MBTiles, no Mapbox).
    # Serves ./tiles/hillshade.mbtiles built by `python -m prospector.ingest basemap`.
    image: maptiler/tileserver-gl:latest
    container_name: prospector-tiles
    command: ["--config", "/data/config.json"]
    ports:
      - "8080:8080"
    volumes:
      - ./tiles:/data:ro
    restart: unless-stopped

  backend:
    # FastAPI backend, containerized (Phase 3b) so the desktop app no longer needs a
    # host Python/venv. Build context is the repo root so the Dockerfile can copy backend/.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: prospector-backend:local
    container_name: prospector-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Talk to the db SERVICE on its internal port 5432 (not the host's 1776 mapping).
      # db/base.py rewrites postgresql:// -> postgresql+psycopg://.
      DATABASE_URL: "postgresql://prospector:prospector@db:5432/prospector"
      LLM_MOCK_MODE: "true"      # v1 is offline — never calls Anthropic.
      ANTHROPIC_API_KEY: ""
    volumes:
      # Placer scoring samples this slope raster via the in-image gdallocationinfo.
      - ./backend/data/processed/slope.tif:/app/data/processed/slope.tif:ro
      # Field-find photos are written at runtime — keep them in a named volume,
      # not the 18 GB host backend/data.
      - prospector_findphotos:/app/data/find-photos
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  prospector_pgdata:
  prospector_findphotos:
