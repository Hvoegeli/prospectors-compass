services:
  db:
    build:
      context: ./infra/db
    image: prospector-db:local
    container_name: prospector-db
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector
      POSTGRES_DB: prospector
    ports:
      # Host port 1776 (5432 is taken by another project on this machine);
      # container still speaks 5432 internally.
      - "1776:5432"
    volumes:
      - prospector_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tileserver:
    # Self-hosted basemap tiles (stack-locked: TileServer GL + MBTiles, no Mapbox).
    # Serves ./tiles/hillshade.mbtiles built by `python -m prospector.ingest basemap`.
    image: maptiler/tileserver-gl:latest
    container_name: prospector-tiles
    command: ["--config", "/data/config.json"]
    ports:
      - "8080:8080"
    volumes:
      - ./tiles:/data:ro
    restart: unless-stopped

volumes:
  prospector_pgdata:
